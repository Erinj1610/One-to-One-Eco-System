name: Daily Database Sync (Prod to Staging)

on:
  schedule:
    # Runs every day at 02:00 AM UTC (04:00 AM SAST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  sync:
    name: Sync Prod DB to Staging DB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy psycopg2-binary

      - name: Run Production to Staging Database Sync
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL || 'postgresql://postgres:%40Erinj21610@34.42.254.202/One-to-One-Portal-Database' }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL || 'postgresql://postgres:%40Erinj21610@34.42.254.202/one_to_one_staging_db' }}
        run: |
          python backend/scripts/sync_prod_to_staging.py
