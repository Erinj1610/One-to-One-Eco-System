name: Scheduled Palladium ERP Sync

on:
  schedule:
    # Runs every hour on the hour
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  sync_palladium:
    name: Sync Palladium Inventory to Cloud SQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy psycopg2-binary pymssql

      - name: Run Palladium Sync Script
        run: |
          python backend/scripts/sync_palladium_cli.py
